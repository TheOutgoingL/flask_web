<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else '错误' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 600px;
            width: 100%;
            margin: 20px;
        }
        .error-icon {
            font-size: 4rem;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <div class="error-icon mb-4">
                        <i class="fas fa-exclamation-triangle"></i>
                        ⚠️
                    </div>
                    <h1 class="card-title h2 mb-3 text-danger">
                        {{ title if title else '发生错误' }}
                    </h1>
                    <p class="card-text lead mb-3">
                        {{ message if message else '请求处理失败' }}
                    </p>
                    {% if detail %}
                    <div class="alert alert-light" role="alert">
                        <small class="text-muted">{{ detail }}</small>
                    </div>
                    {% endif %}
                    <div class="mt-4">
                        <a href="/" class="btn btn-primary me-2">返回首页</a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">返回上页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
