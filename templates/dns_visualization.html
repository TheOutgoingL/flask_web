<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS解析流程可视化</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/vis-network/9.1.6/dist/dist/vis-network.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/vis-network/9.1.6/standalone/umd/vis-network.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        table {
            border-collapse: collapse;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 5px;
        }

        #loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 4px;
            background-color: red;
            z-index: 9999;
            transition: width 0.4s ease;
        }

        .query-section {
            width: 1100px;
            padding: 20px;
            text-align: center;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        .query-section input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
            margin-right: 10px;
        }

        .query-section button {
            padding: 10px 20px;
            font-size: 16px;
            margin-right: 50px;
        }

        .query-section h3 {
            margin-right: 10px;
            position: relative;
            right: 0;
        }

        .node-info {
            width: 310px;
            height: 78px;
            border: 2px solid lightgray;
            margin-left: 10px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .node-info label {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .node-info input {
            width: 200px;
            margin-bottom: 10px;
            padding: 4px;
        }

        .query-records {
            height: auto;
            position: fixed;
            z-index: 2;
            left: 20px;
            top: 200px;
            bottom: 50px;
        }

        .colorTags {
            height: auto;
            position: fixed;
            z-index: 2;
            right: 20px;
            top: 200px;
            bottom: 50px;
        }

        #mynetwork {
            width: 1200px;
            height: 800px;
            box-shadow: 10px 5px 5px lightgray,
            -10px 5px 5px lightgray,
            10px -5px 5px lightgray,
            -10px -5px 5px lightgray;
        }

        #fileInput {
            display: none;
        }

        .file-upload {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .file-upload:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<div id="loading-bar"></div>
<div>
    <div class="query-section">
        <label for="fileInput" class="file-upload">选择日志文件</label>
        <input type="file" id="fileInput" accept=".txt">
        <button onclick="processLogFile()">可视化DNS解析</button>
        <h3>双击节点<br>查看信息</h3>
        <div class="node-info">
            <div style="margin-bottom: 2px">
                <label for="node_name">节点名称</label>
                <input type="text" id="node_name" class="form-control" aria-describedby="emailHelp">
            </div>
            <div>
                <label for="group_name">节点标签</label>
                <input type="text" id="group_name" class="form-control" aria-describedby="emailHelp">
            </div>
        </div>
    </div>
    <HR style="border:1px double #987cb9" width=100% color=#987cb9 SIZE=1>
    <div style="display: flex; margin-top: 30px;">
        <div class="query-records">
            <table class="showRecords">
                <tr>
                    <th>解析信息</th>
                    <th>值</th>
                </tr>
                <tr>
                    <td>域名</td>
                    <td id="domain-name"></td>
                </tr>
                <tr>
                    <td>解析状态</td>
                    <td id="resolution-status"></td>
                </tr>
                <tr>
                    <td>解析步骤数</td>
                    <td id="total-steps"></td>
                </tr>
            </table>
            <div id="records"></div>
        </div>
        <div id="mynetwork"></div>
        <div class="colorTags">
            <table>
                <tr>
                    <th>颜色</th>
                    <th>标签</th>
                </tr>
                <tr>
                    <td bgcolor="lightgreen"></td>
                    <td>权威服务器(NS)</td>
                </tr>
                <tr>
                    <td bgcolor="lightblue"></td>
                    <td>NS服务器IP</td>
                </tr>
                <tr>
                    <td bgcolor="pink"></td>
                    <td>CNAME记录</td>
                </tr>
                <tr>
                    <td bgcolor="#B5BEED"></td>
                    <td>查询域名</td>
                </tr>
                <tr>
                    <td bgcolor="yellow"></td>
                    <td>A记录(IP地址)</td>
                </tr>
                <tr>
                    <td bgcolor="skyblue"></td>
                    <td>父域</td>
                </tr>
                <tr>
                    <td bgcolor="#FF9999"></td>
                    <td>错误</td>
                </tr>
            </table>
        </div>
    </div>
    <HR style="border:3px double #987cb9" width=1200px color=#987cb9 SIZE=3>
</div>

<script>
    // 全局变量存储解析后的数据
    let dnsData = null;
    
    // 处理上传的日志文件
    function processLogFile() {
        const fileInput = document.getElementById('fileInput');
        const loadingBar = document.getElementById('loading-bar');
        
        if (!fileInput.files || fileInput.files.length === 0) {
            alert('请先选择日志文件');
            return;
        }
        
        // 显示加载条
        loadingBar.style.width = '50%';
        
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const content = e.target.result;
            // 查找JSON数据部分
            const jsonStartIndex = content.indexOf('================ 最终解析结果（数据库格式） ================');
            if (jsonStartIndex === -1) {
                alert('无法在日志文件中找到解析结果数据');
                loadingBar.style.width = '0';
                return;
            }
            
            const jsonDataStart = content.indexOf('{', jsonStartIndex);
            const jsonDataEnd = content.indexOf('================ 解析路径摘要 ================', jsonDataStart);
            
            if (jsonDataStart === -1 || jsonDataEnd === -1) {
                alert('无法解析日志文件中的JSON数据');
                loadingBar.style.width = '0';
                return;
            }
            
            const jsonStr = content.substring(jsonDataStart, jsonDataEnd).trim();
            
            try {
                dnsData = JSON.parse(jsonStr);
                visualizeDnsData(dnsData);
                
                // 完成加载
                loadingBar.style.width = '100%';
                setTimeout(() => {
                    loadingBar.style.width = '0';
                }, 500);
            } catch (error) {
                console.error('解析JSON数据失败:', error);
                alert('解析JSON数据失败: ' + error.message);
                loadingBar.style.width = '0';
            }
        };
        
        reader.onerror = function() {
            alert('读取文件失败');
            loadingBar.style.width = '0';
        };
        
        reader.readAsText(file);
    }
    
    // 可视化DNS数据
    function visualizeDnsData(data) {
        if (!data || !data.queries || !data.dns_records || !data.domain_dependencies) {
            alert('数据格式不正确');
            return;
        }
        
        // 更新基本信息
        const query = data.queries[0];
        document.getElementById('domain-name').textContent = query.domain_name;
        document.getElementById('resolution-status').textContent = query.resolution_status;
        document.getElementById('total-steps').textContent = query.total_steps;
        
        // 创建节点和边
        const nodes = [];
        const edges = [];
        const nodeIds = new Set();
        
        // 辅助函数检查节点是否已存在
        const nodeExists = (id) => nodeIds.has(id);
        
        // 辅助函数检查边是否已存在
        const edgeExists = (from, to) => {
            return edges.some(edge => edge.from === from && edge.to === to);
        };
        
        // 添加域名节点
        function addDomainNode(domain, group = 'domain') {
            const id = `domain_${domain}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: domain,
                    group: group
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加NS服务器节点
        function addNSNode(ns) {
            const id = `ns_${ns}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: ns,
                    group: 'ns'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加IP节点
        function addIPNode(ip, isNSIP = false) {
            const prefix = isNSIP ? 'server_ip_' : 'ip_';
            const id = `${prefix}${ip}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: ip,
                    group: isNSIP ? 'ns_ip' : 'ip'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加CNAME节点
        function addCNAMENode(cname) {
            const id = `cname_${cname}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: cname,
                    group: 'cname'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加边
        function addEdge(from, to, label, isDashed = false) {
            if (!edgeExists(from, to)) {
                const edge = {
                    from: from,
                    to: to,
                    label: label,
                    arrows: 'to'
                };
                
                if (isDashed) {
                    edge.dashes = true;
                }
                
                edges.push(edge);
            }
        }
        
        // 按照解析步骤顺序处理DNS记录
        // 首先创建所有节点
        const stepMap = new Map(); // 用于存储每个步骤的关键节点
        
        // 处理域名依赖关系
        const domainParentMap = new Map();
        data.domain_dependencies.forEach(dep => {
            domainParentMap.set(dep.domain, dep.parent_domain);
        });
        
        // 按步骤顺序处理DNS记录
        data.dns_records.forEach(record => {
            const step = record.step_number;
            const queryDomain = record.query_domain;
            const parentDomain = record.parent_domain;
            const recordType = record.record_type;
            
            // 创建查询域名节点
            const queryDomainId = addDomainNode(queryDomain);
            
            // 创建父域节点
            const parentDomainId = addDomainNode(parentDomain, 'parent_domain');
            
            // 存储步骤信息
            if (!stepMap.has(step)) {
                stepMap.set(step, {
                    queryDomainId,
                    parentDomainId,
                    serverIds: [],
                    serverIpIds: [],
                    targetIds: [],
                    recordType
                });
            }
            
            // 处理服务器信息
            if (record.server_used && record.server_used.trim() !== '') {
                const serverParts = record.server_used.match(/([^(]+)\s*\(([^)]+)\)/);
                if (serverParts) {
                    const serverName = serverParts[1].trim();
                    const serverIP = serverParts[2].trim();
                    
                    // 添加服务器节点
                    const serverId = addNSNode(serverName);
                    
                    // 添加服务器IP节点
                    const serverIpId = addIPNode(serverIP, true);
                    
                    // 存储服务器ID
                    stepMap.get(step).serverIds.push(serverId);
                    stepMap.get(step).serverIpIds.push(serverIpId);
                }
            }
            
            // 根据记录类型处理
            switch(recordType) {
                case 'NS':
                    // 添加NS记录
                    if (Array.isArray(record.record_values)) {
                        record.record_values.forEach(ns => {
                            const nsId = addNSNode(ns);
                            stepMap.get(step).targetIds.push(nsId);
                        });
                    }
                    break;
                    
                case 'A':
                    // 添加A记录
                    if (Array.isArray(record.record_values)) {
                        record.record_values.forEach(ip => {
                            const ipId = addIPNode(ip);
                            stepMap.get(step).targetIds.push(ipId);
                        });
                    }
                    break;
                    
                case 'CNAME':
                    // 添加CNAME记录
                    const cnameTarget = record.record_values;
                    const cnameId = addCNAMENode(cnameTarget);
                    stepMap.get(step).targetIds.push(cnameId);
                    break;
                    
                case 'ERROR':
                    // 添加错误节点
                    const errorId = `error_${step}`;
                    if (!nodeExists(errorId)) {
                        nodes.push({
                            id: errorId,
                            label: record.note,
                            group: 'error'
                        });
                        nodeIds.add(errorId);
                    }
                    stepMap.get(step).targetIds.push(errorId);
                    break;
            }
        });
        
        // 处理Glue记录
        const nsToIpMap = new Map();
        data.glue_records.forEach(glue => {
            const nsId = `ns_${glue.ns_name}`;
            const ipId = `server_ip_${glue.ip_address}`;
            
            if (!nodeExists(nsId)) {
                nodes.push({
                    id: nsId,
                    label: glue.ns_name,
                    group: 'ns'
                });
                nodeIds.add(nsId);
            }
            
            if (!nodeExists(ipId)) {
                nodes.push({
                    id: ipId,
                    label: glue.ip_address,
                    group: 'ns_ip'
                });
                nodeIds.add(ipId);
            }
            
            // 存储NS到IP的映射
            if (!nsToIpMap.has(nsId)) {
                nsToIpMap.set(nsId, []);
            }
            nsToIpMap.get(nsId).push(ipId);
        });
        
        // 按照解析步骤顺序创建边
        let prevStep = null;
        
        // 首先添加域名依赖关系的边
        data.domain_dependencies.forEach(dep => {
            const domainId = `domain_${dep.domain}`;
            const parentId = `domain_${dep.parent_domain}`;
            addEdge(domainId, parentId, 'isSubdomainOf');
        });
        
        // 按步骤顺序添加边
        for (let i = 1; i <= stepMap.size; i++) {
            const step = stepMap.get(i);
            if (!step) continue;
            
            // 连接查询域名和父域
            addEdge(step.queryDomainId, step.parentDomainId, 'isSubdomainOf');
            
            // 连接服务器和其IP
            step.serverIds.forEach((serverId, index) => {
                if (index < step.serverIpIds.length) {
                    addEdge(serverId, step.serverIpIds[index], 'hasIP');
                }
            });
            
            // 连接查询域名和服务器（使用虚线表示查询关系）
            step.serverIds.forEach(serverId => {
                addEdge(step.queryDomainId, serverId, 'queriedBy', true);
            });
            
            // 连接查询域名和目标记录
            step.targetIds.forEach(targetId => {
                const label = step.recordType === 'NS' ? 'hasNS' : 
                              step.recordType === 'A' ? 'hasIP' : 
                              step.recordType === 'CNAME' ? 'hasCNAME' : 'error';
                addEdge(step.queryDomainId, targetId, label);
            });
            
            // 连接NS服务器和其IP（胶水记录）
            step.targetIds.forEach(targetId => {
                if (targetId.startsWith('ns_') && nsToIpMap.has(targetId)) {
                    nsToIpMap.get(targetId).forEach(ipId => {
                        addEdge(targetId, ipId, 'hasGlue');
                    });
                }
            });
            
            // 连接前一步和当前步骤（如果是CNAME链）
            if (prevStep && prevStep.recordType === 'CNAME' && 
                prevStep.targetIds.length > 0 && 
                prevStep.targetIds[0].startsWith('cname_')) {
                const prevCnameId = prevStep.targetIds[0];
                addEdge(prevCnameId, step.queryDomainId, 'resolves', true);
            }
            
            prevStep = step;
        }
        
        // 创建网络图
        const container = document.getElementById('mynetwork');
        const visNodes = new vis.DataSet(nodes);
        const visEdges = new vis.DataSet(edges);
        const visData = {nodes: visNodes, edges: visEdges};
        
        // 添加说明文字
        const infoDiv = document.createElement('div');
        infoDiv.style.position = 'absolute';
        infoDiv.style.top = '10px';
        infoDiv.style.left = '10px';
        infoDiv.style.padding = '10px';
        infoDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
        infoDiv.style.border = '1px solid #ddd';
        infoDiv.style.borderRadius = '5px';
        infoDiv.style.fontSize = '14px';
        infoDiv.style.zIndex = '1000';
        infoDiv.innerHTML = `
            <div style="font-weight: bold; margin-bottom: 5px;">DNS递归解析流程图</div>
            <div>此图展示了DNS解析的完整递归过程：</div>
            <div>1. 从根服务器(.)开始查询</div>
            <div>2. 逐级查询顶级域、二级域等</div>
            <div>3. 最终解析到IP地址或CNAME记录</div>
            <div style="margin-top: 5px;"><small>提示：按住Ctrl键可以缩放图表</small></div>
        `;
        container.appendChild(infoDiv);
        
        const options = {
            groups: {
                domain: {color: {background: '#B5BEED'}, font: {multi: 'md', size: 16}},
                parent_domain: {shape: 'box', color: {background: 'skyblue'}, font: {size: 14}},
                ns: {shape: 'box', color: {background: 'lightgreen'}, font: {size: 14}},
                ns_ip: {shape: 'box', color: {background: 'lightblue'}, font: {size: 14}},
                ip: {shape: 'box', color: {background: 'yellow'}, font: {size: 14}},
                cname: {shape: 'box', color: {background: 'pink'}, font: {size: 14}},
                error: {shape: 'box', color: {background: '#FF9999'}, font: {size: 14}}
            },
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: 'UD',  // 从上到下的层次结构
                    sortMethod: 'directed',
                    levelSeparation: 150,
                    nodeSpacing: 150
                }
            },
            physics: {
                enabled: true,
                hierarchicalRepulsion: {
                    centralGravity: 0.0,
                    springLength: 150,
                    springConstant: 0.01,
                    nodeDistance: 120,
                    damping: 0.09
                },
                solver: 'hierarchicalRepulsion'
            },
            edges: {
                smooth: {
                    type: 'cubicBezier',
                    forceDirection: 'vertical',
                    roundness: 0.4
                },
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.8
                    }
                },
                color: {
                    inherit: false,
                    color: '#666666'
                },
                font: {
                    size: 12,
                    align: 'middle'
                }
            },
            interaction: {
                zoomView: false,
                navigationButtons: true,
                keyboard: true,
                tooltipDelay: 200
            }
        };
        
        const network = new vis.Network(container, visData, options);
        
        // 添加键盘事件监听器
        let ctrlPressed = false;
        document.addEventListener('keydown', function (event) {
            if (event.ctrlKey) {
                ctrlPressed = true;
                network.setOptions({interaction: {zoomView: true}});
            }
        });
        document.addEventListener('keyup', function (event) {
            if (!event.ctrlKey) {
                ctrlPressed = false;
                network.setOptions({interaction: {zoomView: false}});
            }
        });
        
        // 添加双击事件监听器
        network.on('doubleClick', function (params) {
            if (params.nodes.length > 0) {
                const clickedNode = visNodes.get(params.nodes[0]);
                const groupMap = {
                    'ns_ip': 'NS服务器IP',
                    'ip': 'A记录(IP地址)',
                    'domain': '查询域名',
                    'ns': '权威服务器(NS)',
                    'parent_domain': '父域',
                    'cname': 'CNAME记录',
                    'error': '错误'
                };
                document.getElementById('node_name').value = clickedNode.label;
                document.getElementById('group_name').value = groupMap[clickedNode.group] || clickedNode.group;
            }
        });
        
        // 监听节点拖动事件
        network.on('dragStart', function (params) {
            if (params.nodes.length > 0) {
                network.storePositions();
                options.physics.barnesHut.springLength = 280;
                network.setOptions(options);
            }
        });
        
        // 拖动结束还原边的长度
        network.on('dragEnd', function (params) {
            if (params.nodes.length > 0) {
                network.storePositions();
                options.physics.barnesHut.springLength = 180;
                network.setOptions(options);
            }
        });
        
        // 添加解析步骤记录
        const recordsDiv = document.getElementById('records');
        recordsDiv.innerHTML = '<h3>DNS递归解析步骤:</h3>';
        
        data.dns_records.forEach((step, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.style.marginBottom = '15px';
            stepDiv.style.borderBottom = '1px solid #ddd';
            stepDiv.style.paddingBottom = '10px';
            stepDiv.style.fontSize = '14px';
            
            let recordValues = '';
            if (Array.isArray(step.record_values)) {
                if (step.record_values.length > 3) {
                    recordValues = `${step.record_values.slice(0, 3).join(', ')}... (共${step.record_values.length}条)`;
                } else {
                    recordValues = step.record_values.join(', ');
                }
            } else {
                recordValues = step.record_values;
            }
            
            // 根据记录类型设置不同的颜色
            let typeColor = '';
            switch(step.record_type) {
                case 'NS': typeColor = 'lightgreen'; break;
                case 'A': typeColor = 'yellow'; break;
                case 'CNAME': typeColor = 'pink'; break;
                case 'ERROR': typeColor = '#FF9999'; break;
                default: typeColor = '#B5BEED';
            }
            
            stepDiv.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 5px;">
                    <span style="background-color: #B5BEED; padding: 2px 5px; border-radius: 3px;">步骤 ${step.step_number}</span> 
                    <span style="background-color: ${typeColor}; padding: 2px 5px; border-radius: 3px; margin-left: 5px;">${step.record_type}</span>
                </div>
                <div style="margin-left: 10px;">
                    <div><strong>查询域名:</strong> ${step.query_domain}</div>
                    <div><strong>父域:</strong> ${step.parent_domain}</div>
                    ${step.server_used ? `<div><strong>使用服务器:</strong> ${step.server_used}</div>` : ''}
                    <div>
                        <strong>结果:</strong> 
                        <span style="color: ${step.status === 'SUCCESS' ? 'green' : 'red'};">
                            ${step.record_type === 'NS' ? '发现NS记录' : 
                              step.record_type === 'A' ? '发现IP地址' : 
                              step.record_type === 'CNAME' ? '发现CNAME别名' : 
                              step.record_type === 'ERROR' ? '查询失败' : '其他记录'}
                        </span>
                    </div>
                    <div><strong>记录值:</strong> ${recordValues}</div>
                    <div><strong>说明:</strong> ${step.note}</div>
                </div>
            `;
            
            recordsDiv.appendChild(stepDiv);
        });
        
        // 添加滚动样式
        recordsDiv.style.maxHeight = '600px';
        recordsDiv.style.overflowY = 'auto';
        recordsDiv.style.padding = '10px';
        recordsDiv.style.border = '1px solid #ddd';
        recordsDiv.style.borderRadius = '5px';
        recordsDiv.style.backgroundColor = '#f9f9f9';
    }
</script>
</body>
</html>
