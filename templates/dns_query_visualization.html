<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS解析流程可视化</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/vis-network/9.1.6/dist/dist/vis-network.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/vis-network/9.1.6/standalone/umd/vis-network.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        table {
            border-collapse: collapse;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 5px;
        }

        #loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 4px;
            background-color: red;
            z-index: 9999;
            transition: width 0.4s ease;
        }

        .query-section {
            width: 1100px;
            padding: 20px;
            text-align: center;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        .query-section input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
            margin-right: 10px;
        }

        .query-section button {
            padding: 10px 20px;
            font-size: 16px;
            margin-right: 50px;
        }

        .query-section h3 {
            margin-right: 10px;
            position: relative;
            right: 0;
        }

        .node-info {
            width: 310px;
            height: 78px;
            border: 2px solid lightgray;
            margin-left: 10px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .node-info label {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .node-info input {
            width: 200px;
            margin-bottom: 10px;
            padding: 4px;
        }

        .query-records {
            height: auto;
            position: fixed;
            z-index: 2;
            left: 20px;
            top: 200px;
            bottom: 50px;
        }

        .colorTags {
            height: auto;
            position: fixed;
            z-index: 2;
            right: 20px;
            top: 200px;
            bottom: 50px;
        }

        #mynetwork {
            width: 1200px;
            height: 800px;
            box-shadow: 10px 5px 5px lightgray,
            -10px 5px 5px lightgray,
            10px -5px 5px lightgray,
            -10px -5px 5px lightgray;
        }
    </style>
</head>
<body>
<div id="loading-bar"></div>
<div>
    <div class="query-section">
        <input type="text" id="domain" placeholder="输入域名" value="{{ domain }}">
        <button onclick="queryDomain()">查询</button>
        <h3>双击节点<br>查看信息</h3>
        <div class="node-info">
            <div style="margin-bottom: 2px">
                <label for="node_name">节点名称</label>
                <input type="text" id="node_name" class="form-control" aria-describedby="emailHelp">
            </div>
            <div>
                <label for="group_name">节点标签</label>
                <input type="text" id="group_name" class="form-control" aria-describedby="emailHelp">
            </div>
        </div>
    </div>
    <HR style="border:1px double #987cb9" width=100% color=#987cb9 SIZE=1>
    <div style="display: flex; margin-top: 30px;">
        <div class="query-records">
            <table class="showRecords">
                <tr>
                    <th>解析信息</th>
                    <th>值</th>
                </tr>
                <tr>
                    <td>域名</td>
                    <td id="domain-name"></td>
                </tr>
                <tr>
                    <td>解析状态</td>
                    <td id="resolution-status"></td>
                </tr>
                <tr>
                    <td>解析步骤数</td>
                    <td id="total-steps"></td>
                </tr>
                <tr>
                    <td>总耗时</td>
                    <td id="total-time"></td>
                </tr>
            </table>
            <div id="records"></div>
        </div>
        <div id="mynetwork"></div>
        <div class="colorTags">
            <table>
                <tr>
                    <th>颜色</th>
                    <th>标签</th>
                </tr>
                <tr>
                    <td bgcolor="#FF8C00"></td>
                    <td>根域名(.)</td>
                </tr>
                <tr>
                    <td bgcolor="lightgreen"></td>
                    <td>权威服务器(NS)</td>
                </tr>
                <tr>
                    <td bgcolor="lightblue"></td>
                    <td>NS服务器IP</td>
                </tr>
                <tr>
                    <td bgcolor="pink"></td>
                    <td>CNAME记录</td>
                </tr>
                <tr>
                    <td bgcolor="#B5BEED"></td>
                    <td>查询域名</td>
                </tr>
                <tr>
                    <td bgcolor="yellow"></td>
                    <td>A记录(IP地址)</td>
                </tr>
                <tr>
                    <td bgcolor="skyblue"></td>
                    <td>父域</td>
                </tr>
                <tr>
                    <td bgcolor="#FF9999"></td>
                    <td>错误</td>
                </tr>
            </table>
        </div>
    </div>
    <HR style="border:3px double #987cb9" width=1200px color=#987cb9 SIZE=3>
</div>

<script>
    // 页面加载完成后，如果URL中有域名参数，则自动查询
    document.addEventListener('DOMContentLoaded', function() {
        const domain = document.getElementById('domain').value;
        if (domain) {
            queryDomain();
        }
    });
    
    function queryDomain() {
        const domain = document.getElementById('domain').value;
        const loadingBar = document.getElementById('loading-bar');
        
        if (!domain) {
            alert('请输入域名');
            return;
        }
        
        // 显示加载条
        loadingBar.style.width = '50%';
        
        // 更新URL，不刷新页面
        window.history.pushState({}, '', `/dns_query?domain=${domain}`);
        
        // 发送请求到后端
        fetch(`/dns_query_data?domain=${domain}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }
                return response.json();
            })
            .then(data => {
                visualizeDnsData(data);
                
                // 完成加载
                loadingBar.style.width = '100%';
                setTimeout(() => {
                    loadingBar.style.width = '0';
                }, 500);
            })
            .catch(error => {
                console.error('获取DNS数据失败:', error);
                alert('获取DNS数据失败: ' + error.message);
                loadingBar.style.width = '0';
            });
    }
    
    // 可视化DNS数据
    function visualizeDnsData(data) {
        // 获取域名
        const domainName = Object.keys(data)[0];
        const domainData = data[domainName];
        
        // 更新基本信息
        document.getElementById('domain-name').textContent = domainName;
        document.getElementById('resolution-status').textContent = domainData.解析总结.解析状态;
        document.getElementById('total-steps').textContent = domainData.解析步骤.length;
        document.getElementById('total-time').textContent = domainData.解析总结.总耗时;
        
        // 创建节点和边
        const nodes = [];
        const edges = [];
        const nodeIds = new Set();
        
        // 辅助函数检查节点是否已存在
        const nodeExists = (id) => nodeIds.has(id);
        
        // 辅助函数检查边是否已存在
        const edgeExists = (from, to) => {
            return edges.some(edge => edge.from === from && edge.to === to);
        };
        
        // 添加域名节点
        function addDomainNode(domain, group = 'domain') {
            const id = `domain_${domain}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: domain,
                    group: group
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加根域名节点
        function addRootNode() {
            const id = 'root_.';
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: '.',
                    group: 'root'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加NS服务器节点
        function addNSNode(ns) {
            const id = `ns_${ns}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: ns,
                    group: 'ns'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加IP节点
        function addIPNode(ip, isNSIP = false) {
            const prefix = isNSIP ? 'server_ip_' : 'ip_';
            const id = `${prefix}${ip}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: ip,
                    group: isNSIP ? 'ns_ip' : 'ip'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加CNAME节点
        function addCNAMENode(cname) {
            const id = `cname_${cname}`;
            if (!nodeExists(id)) {
                nodes.push({
                    id: id,
                    label: cname,
                    group: 'cname'
                });
                nodeIds.add(id);
            }
            return id;
        }
        
        // 添加边
        function addEdge(from, to, label, isDashed = false) {
            if (!edgeExists(from, to)) {
                const edge = {
                    from: from,
                    to: to,
                    label: label,
                    arrows: 'to'
                };
                
                if (isDashed) {
                    edge.dashes = true;
                }
                
                edges.push(edge);
            }
        }
        
        // 按照解析步骤顺序处理DNS记录
        // 首先创建所有节点
        const stepMap = new Map(); // 用于存储每个步骤的关键节点
        
        // 添加根域名节点
        const rootNodeId = addRootNode();
        
        // 处理域名依赖关系
        const domainParentMap = new Map();
        for (const [parent, children] of Object.entries(domainData.域名依赖关系)) {
            for (const child of children) {
                domainParentMap.set(child, parent);
            }
        }
        
        // 按步骤顺序处理DNS记录
        domainData.解析步骤.forEach(record => {
            const step = record.步骤;
            const queryDomain = record.查询内容;
            const parentDomain = record.父域;
            const recordType = record.结果.类型;
            
            // 创建查询域名节点
            const queryDomainId = addDomainNode(queryDomain);
            
            // 创建父域节点
            let parentDomainId;
            if (parentDomain === '.') {
                parentDomainId = rootNodeId;
            } else {
                parentDomainId = addDomainNode(parentDomain, 'parent_domain');
            }
            
            // 存储步骤信息
            if (!stepMap.has(step)) {
                stepMap.set(step, {
                    queryDomainId,
                    parentDomainId,
                    serverIds: [],
                    serverIpIds: [],
                    targetIds: [],
                    recordType
                });
            }
            
            // 处理服务器信息
            if (record.使用的NS服务器 && record.使用的NS服务器.trim() !== '') {
                const serverParts = record.使用的NS服务器.match(/([^(]+)\s*\(([^)]+)\)/);
                if (serverParts) {
                    const serverName = serverParts[1].trim();
                    const serverIP = serverParts[2].trim();
                    
                    // 添加服务器节点
                    const serverId = addNSNode(serverName);
                    
                    // 添加服务器IP节点
                    const serverIpId = addIPNode(serverIP, true);
                    
                    // 存储服务器ID
                    stepMap.get(step).serverIds.push(serverId);
                    stepMap.get(step).serverIpIds.push(serverIpId);
                }
            }
            
            // 根据记录类型处理
            switch(recordType) {
                case 'NS':
                    // 添加NS记录
                    if (Array.isArray(record.结果.记录)) {
                        record.结果.记录.forEach(ns => {
                            const nsId = addNSNode(ns);
                            stepMap.get(step).targetIds.push(nsId);
                        });
                    }
                    break;
                    
                case 'A':
                    // 添加A记录
                    if (Array.isArray(record.结果.记录)) {
                        record.结果.记录.forEach(ip => {
                            const ipId = addIPNode(ip);
                            stepMap.get(step).targetIds.push(ipId);
                        });
                    }
                    break;
                    
                case 'CNAME':
                    // 添加CNAME记录
                    if (Array.isArray(record.结果.记录) && record.结果.记录.length > 0) {
                        const cnameTarget = record.结果.记录[0];
                        const cnameId = addCNAMENode(cnameTarget);
                        stepMap.get(step).targetIds.push(cnameId);
                    }
                    break;
                    
                case 'ERROR':
                    // 添加错误节点
                    const errorId = `error_${step}`;
                    if (!nodeExists(errorId)) {
                        nodes.push({
                            id: errorId,
                            label: record.备注,
                            group: 'error'
                        });
                        nodeIds.add(errorId);
                    }
                    stepMap.get(step).targetIds.push(errorId);
                    break;
            }
        });
        
        // 处理Glue记录
        const nsToIpMap = new Map();
        for (const [ns, data] of Object.entries(domainData.Glue记录)) {
            const nsId = `ns_${ns}`;
            
            if (!nodeExists(nsId)) {
                nodes.push({
                    id: nsId,
                    label: ns,
                    group: 'ns'
                });
                nodeIds.add(nsId);
            }
            
            // 存储NS到IP的映射
            if (!nsToIpMap.has(nsId)) {
                nsToIpMap.set(nsId, []);
            }
            
            // 处理A记录
            if (data.A && data.A.length > 0) {
                data.A.forEach(ip => {
                    const ipId = addIPNode(ip, true);
                    nsToIpMap.get(nsId).push(ipId);
                });
            }
            
            // 处理AAAA记录
            if (data.AAAA && data.AAAA.length > 0) {
                data.AAAA.forEach(ip => {
                    const ipId = addIPNode(ip, true);
                    nsToIpMap.get(nsId).push(ipId);
                });
            }
        }
        
        // 按照解析步骤顺序创建边
        let prevStep = null;
        
        // 首先添加域名依赖关系的边
        for (const [child, parent] of domainParentMap.entries()) {
            const childId = `domain_${child}`;
            let parentId;
            
            if (parent === '.') {
                parentId = rootNodeId;
            } else {
                parentId = `domain_${parent}`;
            }
            
            if (nodeExists(childId) && nodeExists(parentId)) {
                addEdge(childId, parentId, 'isSubdomainOf');
            }
        }
        
        // 按步骤顺序添加边
        for (let i = 1; i <= stepMap.size; i++) {
            const step = stepMap.get(i);
            if (!step) continue;
            
            // 连接查询域名和父域
            addEdge(step.queryDomainId, step.parentDomainId, 'isSubdomainOf');
            
            // 连接服务器和其IP
            step.serverIds.forEach((serverId, index) => {
                if (index < step.serverIpIds.length) {
                    addEdge(serverId, step.serverIpIds[index], 'hasIP');
                }
            });
            
            // 连接查询域名和服务器（使用虚线表示查询关系）
            step.serverIds.forEach(serverId => {
                addEdge(step.queryDomainId, serverId, 'queriedBy', true);
            });
            
            // 连接查询域名和目标记录
            step.targetIds.forEach(targetId => {
                const label = step.recordType === 'NS' ? 'hasNS' : 
                              step.recordType === 'A' ? 'hasIP' : 
                              step.recordType === 'CNAME' ? 'hasCNAME' : 'error';
                addEdge(step.queryDomainId, targetId, label);
            });
            
            // 连接NS服务器和其IP（胶水记录）
            step.targetIds.forEach(targetId => {
                if (targetId.startsWith('ns_') && nsToIpMap.has(targetId)) {
                    nsToIpMap.get(targetId).forEach(ipId => {
                        addEdge(targetId, ipId, 'hasGlue');
                    });
                }
            });
            
            // 连接前一步和当前步骤（如果是CNAME链）
            if (prevStep && prevStep.recordType === 'CNAME' && 
                prevStep.targetIds.length > 0 && 
                prevStep.targetIds[0].startsWith('cname_')) {
                const prevCnameId = prevStep.targetIds[0];
                addEdge(prevCnameId, step.queryDomainId, 'resolves', true);
            }
            
            prevStep = step;
        }
        
        // 创建网络图
        const container = document.getElementById('mynetwork');
        
        // 定义节点组的样式
        const groups = {
            root: {
                color: { background: '#FF8C00' },
                font: { size: 18 }
            },
            domain: {
                color: { background: '#B5BEED' },
                font: { size: 16 }
            },
            parent_domain: {
                color: { background: 'skyblue' },
                font: { size: 16 }
            },
            ns: {
                color: { background: 'lightgreen' },
                font: { size: 14 }
            },
            ns_ip: {
                color: { background: 'lightblue' },
                font: { size: 14 }
            },
            ip: {
                color: { background: 'yellow' },
                font: { size: 14 }
            },
            cname: {
                color: { background: 'pink' },
                font: { size: 14 }
            },
            error: {
                color: { background: '#FF9999' },
                font: { size: 14 }
            }
        };
        
        const options = {
            groups: groups,
            physics: {
                stabilization: true,
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.3,
                    springLength: 150,
                    springConstant: 0.04,
                    damping: 0.09
                }
            },
            interaction: {
                navigationButtons: true,
                keyboard: true
            }
        };
        
        const network = new vis.Network(container, {nodes: nodes, edges: edges}, options);
        
        // 双击节点显示信息
        network.on("doubleClick", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.find(n => n.id === nodeId);
                if (node) {
                    document.getElementById('node_name').value = node.label;
                    document.getElementById('group_name').value = node.group;
                }
            }
        });
    }
</script>
</body>
</html>
