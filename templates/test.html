<div id="loading-bar"></div> <!-- 加载条 -->
<div>

                    <td>域名IP地址</td>
                </tr>

<script>
    let isAggregate = false; // 初始化模式为分离态
    function queryDomain() {
        const domain = document.getElementById('domain').value;
        const loadingBar = document.getElementById('loading-bar');
        const recordsDiv = document.getElementById('records');

        // 显示加载条并启动动画
        loadingBar.style.width = '50%';

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/query', true);
        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                // 将加载条宽度设置为100%，然后隐藏加载条
                loadingBar.style.width = '100%';
                setTimeout(() => {
                    loadingBar.style.width = '0';
                }, 500);

                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    const nodes = []; // 存储节点
                    const edges = []; // 存储边
                    const nodeIds = new Set(); // 存储已有节点的ID

                    // 添加查询记录
                    const newRecord = document.createElement('div');
                    newRecord.textContent = domain;
                    {#recordsDiv.appendChild(newRecord);#}

                    // 添加节点和边的函数，避免重复
                    const addNodesAndEdges = (domainData) => {
                        const findByDNSNodes = (domainData.FindBy_DNS || []).map((dns, i) => ({
                            id: `find_by_dns_${dns}`,
                            label: dns,
                            group: 'find_by_dns'
                        }));
                        findByDNSNodes.forEach(node => {
                            if (!nodeIds.has(node.id)) {
                                nodes.push(node);
                                nodeIds.add(node.id);
                            }
                        });

                        const authDNSNodes = (domainData.Auth_DNS || []).map((dns, i) => ({
                            id: `auth_dns_${dns}`,
                            label: dns,
                            group: 'auth_dns'
                        }));
                        authDNSNodes.forEach(node => {
                            if (!nodeIds.has(node.id)) {
                                nodes.push(node);
                                nodeIds.add(node.id);
                            }
                        });

                        const authIPNodes = (domainData.Auth_IP || []).map((ip, i) => ({
                            id: `auth_ip_${ip}`,
                            label: ip,
                            group: 'auth_ip'
                        }));
                        authIPNodes.forEach(node => {
                            if (!nodeIds.has(node.id)) {
                                nodes.push(node);
                                nodeIds.add(node.id);
                            }
                        });

                        const cnameNodes = (domainData.CNAME || []).map((cname, i) => ({
                            id: `cname_${cname}`,
                            label: cname,
                            group: 'cname'
                        }));
                        if (cnameNodes.length > 0 && cnameNodes[0].label !== "null") {
                            cnameNodes.forEach(node => {
                                if (!nodeIds.has(node.id)) {
                                    nodes.push(node);
                                    nodeIds.add(node.id);
                                }
                            });
                        }

                        const dnsNodes = (domainData.DNS || []).map((dns, i) => ({
                            id: `dns_${dns}`,
                            label: dns,
                            group: 'dns'
                        }));
                        dnsNodes.forEach(node => {
                            if (!nodeIds.has(node.id)) {
                                nodes.push(node);
                                nodeIds.add(node.id);
                            }
                        });

                        const dnsIPNodes = (domainData.DNS_IP || []).map((ip, i) => ({
                            id: `dns_ip_${ip}`,
                            label: ip,
                            group: 'dns_ip'
                        }));
                        dnsIPNodes.forEach(node => {
                            if (!nodeIds.has(node.id)) {
                                nodes.push(node);
                                nodeIds.add(node.id);
                            }
                        });

                        // 辅助函数检查边是否已存在
                        const edgeExists = (from, to, label) => {
                            return edges.some(edge => edge.from === from && edge.to === to && edge.label === label);
                        };

                        if (findByDNSNodes.length > 0) {
                            authDNSNodes.forEach((authDNSNode, i) => {
                                if (!edgeExists(findByDNSNodes[0].id, authDNSNode.id, 'ns')) {
                                    edges.push({
                                        from: findByDNSNodes[0].id,
                                        to: authDNSNode.id,
                                        label: 'ns',
                                        arrows: 'to'
                                    });
                                }
                                if (authIPNodes[i]) {
                                    if (!edgeExists(authDNSNode.id, authIPNodes[i].id, 'IP')) {
                                        edges.push({
                                            from: authDNSNode.id,
                                            to: authIPNodes[i].id,
                                            label: 'IP',
                                            arrows: 'to'
                                        });
                                    }
                                }
                            });
                        }

                        if (cnameNodes.length > 0 && cnameNodes[0].label !== "null") {

                            if (findByDNSNodes.length > 0) {
                                if (!edgeExists(cnameNodes[0].id, findByDNSNodes[0].id, 'Find_NS_By')) {
                                    edges.push({
                                        from: cnameNodes[0].id,
                                        to: findByDNSNodes[0].id,
                                        label: 'Find_NS_By',
                                        arrows: 'to'
                                    });
                                }
                            }
                        }

                        if (findByDNSNodes.length > 0) {
                            dnsNodes.forEach((dnsNode, i) => {
                                dnsIPNodes.forEach((dnsIPNode, j) => {
                                    if (!edgeExists(dnsNode.id, dnsIPNode.id, 'DNS_IP')) {
                                        edges.push({
                                            from: dnsNode.id,
                                            to: dnsIPNode.id,
                                            label: 'DNS_IP',
                                            arrows: 'to'
                                        });
                                    }
                                });
                                if (!edgeExists(dnsNode.id, findByDNSNodes[0].id, 'Find_NS_By')) {
                                    edges.push({
                                        from: dnsNode.id,
                                        to: findByDNSNodes[0].id,
                                        label: 'Find_NS_By',
                                        arrows: 'to'
                                    });
                                }
                            });
                            if (cnameNodes.length > 0 && cnameNodes[0].label !== "null") {
                                if (!edgeExists(dnsNodes[0].id, cnameNodes[0].id, 'CNAME')) {
                                    edges.push({
                                        from: dnsNodes[0].id,
                                        to: cnameNodes[0].id,
                                        label: 'CNAME',
                                        arrows: 'to'
                                    });
                                }
                            }
                        }
                    };

                    // 检查响应是单个对象还是对象列表
                    if (Array.isArray(data)) {
                        data.forEach(domainData => addNodesAndEdges(domainData));
                    } else {
                        addNodesAndEdges(data);
                    }

                    // 更新vis.js网络数据
                    const container = document.getElementById("mynetwork");
                    const visNodes = new vis.DataSet(nodes);
                    const visEdges = new vis.DataSet(edges);
                    const visData = {nodes: visNodes, edges: visEdges};
                    const options = {
                        groups: {
                            auth_dns: {shape: 'box', color: {background: 'lightgreen'}},
                            auth_ip: {shape: 'box', color: {background: 'lightblue'}},
                            cname: {shape: 'box', color: {background: 'pink'}},
                            dns: {color: {background: '#B5BEED'}, font: {multi: 'md', size: 20}},
                            dns_ip: {shape: 'box', color: {background: 'yellow'}},
                            find_by_dns: {shape: 'box', color: {background: 'skyblue'}}
                        },
                        physics: {
                            barnesHut: {
                                springLength: 180, // 增加节点之间的距离
                            }
                        },
                        edges: {
                            smooth: true,
                            arrows: {
                                to: {
                                    enabled: true,
                                }
                            }
                        }
                    };

                    const network = new vis.Network(container, visData, options);

                    // 添加双击事件监听器
                    network.on('doubleClick', function (params) {
                        if (params.nodes.length > 0) {
                            const clickedNode = visNodes.get(params.nodes[0]);
                            const groupMap = {
                                'auth_ip': '授权服务IP地址',
                                'dns_ip': '域名IP地址',
                                'dns': 'DNS',
                                'auth_dns': '权威服务器',
                                'find_by_dns': '找到NS记录的DNS',
                                'cname': '域名的CNAME'
                            };
                            document.getElementById('node_name').value = clickedNode.label;
                            document.getElementById('group_name').value = groupMap[clickedNode.group] || clickedNode.group;
                        }
                    });

                    // 监听节点拖动事件
                    network.on('dragStart', function (params) {
                        if (params.nodes.length > 0) {
                            const draggedNodeId = params.nodes[0];
                            network.storePositions();
                            const updatedNodes = visNodes.get({
                                filter: function (item) {
                                    return item.id === draggedNodeId;
                                }
                            });

                            // 增加被拖动节点的连线长度
                            if (updatedNodes.length > 0) {
                                options.physics.barnesHut.springLength = 280;
                                network.setOptions(options);
                            }
                        }
                    });
                    // 拖动结束还原边的长度
                    network.on('dragEnd', function (params) {
                        if (params.nodes.length > 0) {
                            const draggedNodeId = params.nodes[0];
                            network.storePositions();
                            const updatedNodes = visNodes.get({
                                filter: function (item) {
                                    return item.id === draggedNodeId;
                                }
                            });

                            // 恢复其他节点的连线长度
                            if (updatedNodes.length > 0) {
                                options.physics.barnesHut.springLength = 200;
                                network.setOptions(options);
                            }
                        }
                    });

                    // 获取查询的服务器数目并更新页面
                    updateServerCount();
                } else {
                    console.error('There was an error!', xhr.responseText);
                }
            }
        };

        xhr.send(JSON.stringify({domain: domain}));
    }

                                'dns_ip': '域名IP地址',
                                'dns': 'DNS',
                                'auth_dns': '权威服务器',
                                'find_by_dns': '找到NS记录的DNS',
                                'cname': '域名的CNAME'
                            };
                            document.getElementById('node_name').value = clickedNode.label;
                            document.getElementById('group_name').value = groupMap[clickedNode.group] || clickedNode.group;
                        }
                    });

                    // 监听节点拖动事件
                    network.on('dragStart', function (params) {
                        if (params.nodes.length > 0) {
                            const draggedNodeId = params.nodes[0];
                            network.storePositions();
                            const updatedNodes = visNodes.get({
                                filter: function (item) {
                                    return item.id === draggedNodeId;
                                }
                            });

                            // 增加被拖动节点的连线长度
                            if (updatedNodes.length > 0) {
                                options.physics.barnesHut.springLength = 300;
                                network.setOptions(options);
                            }
                        }
                    });

                    network.on('dragEnd', function (params) {
                        if (params.nodes.length > 0) {
                            const draggedNodeId = params.nodes[0];
                            network.storePositions();
                            const updatedNodes = visNodes.get({
                                filter: function (item) {
                                    return item.id === draggedNodeId;
                                }
                            });

                            // 恢复其他节点的连线长度
                            if (updatedNodes.length > 0) {
                                options.physics.barnesHut.springLength = 200;
                                network.setOptions(options);
                            }
                        }
                    });
                } else {
                    console.error('There was an error!', xhr.responseText);
                }
            }
        };

        xhr.send(JSON.stringify({domain: domain}));
    }



    // 添加一个函数来获取服务器数目并更新页面
    function updateServerCount() {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', '/server-count', true); // 假设后端有一个'/server-count'的端点来获取服务器数目
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                document.getElementById('server-count').textContent = JSON.parse(xhr.responseText).count;
            }
        };
        xhr.send();
    }

    function  switchModel(){
        isAggregate = !isAggregate; // 点击之后首先变为true 代表聚合态
        const button = document.getElementById('switchButton');
        button.textContent = isAggregate ? '分离' : '聚合';

        if(isAggregate){
            queryDomain01()
        }else{
            queryDomain()
        }
    }

    // 页面加载时获取一次服务器数目
    window.onload = updateServerCount;
</script>
