<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点关联图谱 - {{ domain }}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Vis.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #legend {
            width: 300px;
            min-width: 300px;
            height: 100vh;
            padding: 20px;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        
        #network-container {
            flex: 1;
            height: 100vh;
            position: relative;
        }
        
        #mynetwork {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border: none;
        }
        
        .legend-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .legend-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .legend-table th,
        .legend-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        
        .legend-table th {
            background-color: #e9ecef;
            font-weight: bold;
        }
        
        .color-box {
            width: 20px;
            height: 20px;
            display: inline-block;
            border-radius: 3px;
            margin-right: 8px;
            vertical-align: middle;
            border: 1px solid #ccc;
        }
        
        .domain-info {
            background-color: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        
        .domain-info h4 {
            margin: 0 0 10px 0;
            color: #007bff;
        }
        
        .stats {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        
        .stats h5 {
            margin: 0 0 10px 0;
            color: #495057;
        }
        
        .stat-item {
            margin: 5px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div id="legend">
        <div class="legend-title">节点关联图谱</div>
        
        <div class="domain-info">
            <h4>查询域名</h4>
            <p><strong>{{ domain }}</strong></p>
        </div>
        
        <div class="stats">
            <h5>图谱统计</h5>
            <div class="stat-item">节点数量: <span id="node-count">0</span></div>
            <div class="stat-item">连接数量: <span id="edge-count">0</span></div>
        </div>
        
        {% if graph_data and graph_data.color_map %}
        <div style="margin-top: 20px;">
            <h5>节点类型图例</h5>
            <table class="legend-table">
                <thead>
                    <tr>
                        <th>颜色</th>
                        <th>节点类型</th>
                    </tr>
                </thead>
                <tbody>
                    {% for label, color in graph_data.color_map.items() %}
                    <tr>
                        <td><span class="color-box" style="background-color: {{ color }};"></span></td>
                        <td>{{ label }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% endif %}
        
        <div style="margin-top: 20px;">
            <button class="btn btn-primary btn-sm" onclick="fitNetwork()">适应窗口</button>
            <button class="btn btn-secondary btn-sm" onclick="resetView()">重置视图</button>
        </div>
    </div>
    
    <div id="network-container">
        <div id="mynetwork"></div>
    </div>
    
    <!-- Vis.js JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    
    <script>
        // 图谱数据
        const graphData = {{ graph_data | tojson | safe }};
        
        // 创建节点和边的数据集
        const nodes = new vis.DataSet(graphData.nodes || []);
        const edges = new vis.DataSet(graphData.edges || []);
        
        // 更新统计信息
        document.getElementById('node-count').textContent = nodes.length;
        document.getElementById('edge-count').textContent = edges.length;
        
        // 网络容器
        const container = document.getElementById('mynetwork');
        
        // 网络数据
        const data = {
            nodes: nodes,
            edges: edges
        };
        
        // 网络配置选项
        const options = {
            physics: {
                enabled: true,
                barnesHut: {
                    springLength: 180, // 增加节点之间的距离
                    springConstant: 0.04,
                    damping: 0.09,
                    avoidOverlap: 0.1
                },
                stabilization: {
                    enabled: true,
                    iterations: 150
                }
            },
            nodes: {
                shape: 'dot',
                font: {
                    size: 12,
                    color: '#000000'
                },
                borderWidth: 2,
                shadow: true
            },
            edges: {
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.5
                    }
                },
                color: {
                    color: '#848484',
                    highlight: '#848484',
                    hover: '#848484'
                },
                font: {
                    size: 10,
                    color: '#666666'
                },
                smooth: {
                    type: 'continuous'
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200
            }
        };
        
        // 创建网络
        const network = new vis.Network(container, data, options);
        
        // 网络事件处理
        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                console.log('点击节点:', node);
            }
        });
        
        network.on('hoverNode', function(params) {
            container.style.cursor = 'pointer';
        });
        
        network.on('blurNode', function(params) {
            container.style.cursor = 'default';
        });
        
        // 工具函数
        function fitNetwork() {
            network.fit({
                animation: {
                    duration: 1000,
                    easingFunction: 'easeInOutQuad'
                }
            });
        }
        
        function resetView() {
            network.moveTo({
                position: {x: 0, y: 0},
                scale: 1,
                animation: {
                    duration: 1000,
                    easingFunction: 'easeInOutQuad'
                }
            });
        }
        
        // 页面加载完成后适应窗口
        window.addEventListener('load', function() {
            setTimeout(fitNetwork, 1000);
        });
    </script>
</body>
</html>
